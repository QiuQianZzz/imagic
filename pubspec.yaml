name: imagic
description: "A MD3 Flutter image viewer for Windows."
publish_to: 'none'
repository: https://github.com/QiuQianZzz/imagic

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image: ^4.5.0
  file_picker: ^8.1.6
  path: ^1.9.0
  path_provider: ^2.1.5
  desktop_drop: ^0.5.0
  shared_preferences: ^2.5.0
  window_manager: ^0.4.3
  flutter_svg: ^2.3.0
  win32: ^5.5.0
  ffi: ^2.1.0
  package_info_plus: ^9.0.1
  http: ^1.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  msix: ^3.16.0

msix_config:
  display_name: Imagic
  publisher_display_name: QiuQianZzz
  identity_name: QiuQianZzz.Imagic
  publisher: CN=QiuQianZzz
  msix_version: 0.1.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: runFullTrust
  store: false

flutter:
  uses-material-design: true
  assets:
    - assets/
